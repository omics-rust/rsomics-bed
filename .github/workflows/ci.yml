name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-common
          ref: 9f11f37c0fa48a24cae12549769f3395d9d0f19f
          path: target/ci/rsomics-common
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-help
          ref: c615aa8b85224055faad57c86abd068aded89d06
          path: target/ci/rsomics-help
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-intervals
          ref: 491b14c0d43b58371723488dd8a9482d55a16678
          path: target/ci/rsomics-intervals

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt

      - name: Configure unpublished foundation revisions
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-home"
          cat > "$RUNNER_TEMP/cargo-home/config.toml" <<EOF
          [patch.crates-io]
          rsomics-common = { path = "$GITHUB_WORKSPACE/target/ci/rsomics-common" }
          rsomics-help = { path = "$GITHUB_WORKSPACE/target/ci/rsomics-help" }
          rsomics-intervals = { path = "$GITHUB_WORKSPACE/target/ci/rsomics-intervals" }
          EOF
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - name: Install Linux oracle build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev liblzma-dev zlib1g-dev

      - name: Build pinned bedtools 2.31.1 oracle
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bedtools-2.31.1.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/arq5x/bedtools2/releases/download/v2.31.1/bedtools-2.31.1.tar.gz \
            --output "$archive"
          echo "fc7e660c2279b1e008b80aca0165a4a157daf4994d08a533ee925d73ce732b97  $archive" \
            | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/bedtools2" -j2
          echo "$RUNNER_TEMP/bedtools2/bin" >> "$GITHUB_PATH"

      - name: Verify compatibility oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(bedtools --version)" = "bedtools v2.31.1"

      - name: Format
        if: matrix.target == 'linux-x86_64'
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        if: matrix.target == 'linux-x86_64'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test debug
        run: cargo test --locked --all-features

      - name: Test release
        run: cargo test --release --locked --all-features

      - name: Verify package
        if: matrix.target == 'linux-x86_64'
        run: cargo package --locked

      - name: Benchmark smoke
        if: matrix.target == 'linux-x86_64'
        run: cargo bench --locked --bench operations -- --test
