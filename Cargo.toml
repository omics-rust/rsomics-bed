[package]
name = "rsomics-bed"
version = "0.1.0"
description = "Coherent BED interval operations for sorting, merging, intersection, subtraction, and complement"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-bed"
homepage = "https://github.com/omics-rust/rsomics-bed"
documentation = "https://docs.rs/rsomics-bed"
readme = "README.md"
authors = ["Zane Leong <efd@live.com>"]
categories = ["science", "command-line-utilities"]
keywords = ["bed", "bedtools", "bioinformatics", "intervals", "genomics"]

[lib]
name = "rsomics_bed"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "rsomics-bed"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rsomics-common = "0.7"
rsomics-help = "0.4"
rsomics-intervals = "0.3"
same-file = "1"
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"

[[bench]]
name = "operations"
harness = false
